{% extends "base.html" %}

{% block title %}Enter Customer Info - ConfigFlow{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <!-- Card Wrapper -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

        <!-- Top branding accent -->
        <div class="h-2 bg-gradient-to-r from-indigo-500 to-violet-600"></div>

        <div class="p-8 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Customer Info</h1>
                <p class="text-slate-500 mt-2 text-sm">Create and select a new customer to tie configurations to.</p>
            </div>

            <!-- Form -->
            <form action="/customer/new" method="post" class="space-y-6">
                <!-- Customer Name -->
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Customer Full Name</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user-tag"></i>
                        </div>
                        <input type="text" name="name" id="name" required
                            class="block w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 placeholder-slate-400 text-sm transition-all duration-200"
                            placeholder="Acme Corp / Alice Johnson">
                    </div>
                </div>

                <!-- Customer Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Customer Email Address</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" name="email" id="email" required
                            class="block w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 placeholder-slate-400 text-sm transition-all duration-200"
                            placeholder="alice@acme.com">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center space-x-3 pt-2">
                    <a href="/dashboard" class="flex-1 text-center py-3 border border-slate-300 text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50 rounded-lg transition-all duration-200">
                        Cancel
                    </a>
                    <button type="submit" id="btn-save-customer"
                        class="flex-1 flex justify-center items-center py-3 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200">
                        <span>Save Customer</span>
                        <i class="fa-solid fa-check ml-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
