{% extends "base.html" %}

{% block content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md">
  <div class="bg-white py-10 px-8 shadow-xl rounded-2xl border border-slate-100">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">{{ text.login_title }}</h2>
      <p class="mt-2 text-sm text-slate-500">
        {{ text.login_subtitle }}
      </p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-700 text-sm flex items-center space-x-2 {% if lang == 'fa' %}space-x-reverse{% endif %}">
      <svg class="h-5 w-5 flex-shrink-0 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="space-y-6" action="/login" method="post">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
          {{ text.username }}
        </label>
        <div class="relative">
          <input id="username" name="username" type="text" required value="admin"
            class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
          {{ text.password }}
        </label>
        <div class="relative">
          <input id="password" name="password" type="password" required value="admin"
            class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
        </div>
      </div>

      <div>
        <button type="submit"
          class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-100 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
          {{ text.sign_in }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
